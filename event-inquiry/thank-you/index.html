<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Thank You — The Sweet Spot by Kam</title>
<meta name="robots" content="noindex" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --cream: #faf6ef;
    --cream-deep: #f3ebda;
    --ink: #1f2a26;
    --ink-soft: #5c615c;
    --teal: #5a9b8e;
    --teal-deep: #3f7a6e;
    --gold: #d4a445;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Inter', sans-serif;
    background: var(--cream);
    color: var(--ink);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px;
    -webkit-font-smoothing: antialiased;
  }
  .thank-you { max-width: 620px; text-align: center; }
  .icon {
    width: 72px;
    height: 72px;
    border-radius: 50%;
    background: var(--cream-deep);
    color: var(--gold);
    margin: 0 auto 32px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 32px;
    font-family: 'Playfair Display', serif;
  }
  h1 {
    font-family: 'Playfair Display', serif;
    font-weight: 400;
    font-size: 42px;
    line-height: 1.2;
    margin-bottom: 20px;
    letter-spacing: -0.01em;
  }
  h1 .italic { font-style: italic; color: var(--teal-deep); }
  p {
    color: var(--ink-soft);
    font-size: 17px;
    margin-bottom: 32px;
    line-height: 1.7;
  }
  .actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
  .btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 14px 28px;
    border-radius: 999px;
    font-size: 15px;
    font-weight: 500;
    text-decoration: none;
    transition: all 0.2s;
    border: 1px solid transparent;
  }
  .btn-primary { background: var(--ink); color: var(--cream); }
  .btn-primary:hover { background: var(--teal-deep); }
  .btn-secondary { background: transparent; color: var(--ink); border-color: var(--ink); }
  .btn-secondary:hover { background: var(--ink); color: var(--cream); }
  @media (max-width: 600px) { h1 { font-size: 32px; } }
</style>
</head>
<body>
  <div class="thank-you">
    <div class="icon">&#10022;</div>
    <h1>Thank You for Thinking of <span class="italic">The Sweet Spot by Kam</span></h1>
    <p>Your inquiry has been received, and I&rsquo;m so excited to learn more about your event. I&rsquo;ll review your details and follow up with you soon regarding availability, options, and pricing.</p>
    <div class="actions">
      <a href="/" class="btn btn-primary">Return to Home</a>
      <a href="/#menu" class="btn btn-secondary">Browse Offerings</a>
    </div>
  </div>
</body>
</html>
